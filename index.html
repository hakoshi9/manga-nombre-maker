<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画ノンブルメーカー</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#18212e;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#202e47;color:white;padding:18px 22px}h1{font-size:21px;margin:0}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}main{max-width:1150px;margin:auto;padding:18px;display:grid;grid-template-columns:370px 1fr;gap:18px}.panel{background:white;border:1px solid #dce1e8;border-radius:14px;padding:18px;margin-bottom:16px}h2{font-size:16px;margin:0 0 14px}.field{margin:13px 0}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,select,button{font:inherit}input[type=number],select{width:100%;padding:9px;border:1px solid #c9d2df;border-radius:8px;background:white}input[type=file]{width:100%;font-size:13px}input[type=range]{width:100%}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}button{border:1px solid #b9c7d7;border-radius:8px;padding:9px 12px;background:white;cursor:pointer}button.primary{background:#2865d7;color:white;border-color:#2865d7}button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;color:#617083;line-height:1.6}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px}.thumb{border:1px solid #d9e0e9;border-radius:10px;padding:7px;background:white;text-align:center}.thumb img{width:100%;height:150px;object-fit:contain;background:#f5f5f5}.thumb small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumb .buttons{display:flex;gap:3px;margin-top:5px}.thumb button{padding:4px;flex:1}.preview{display:flex;justify-content:center;background:#e6eaf0;border-radius:10px;padding:14px;min-height:260px}.preview canvas{max-width:100%;max-height:510px;object-fit:contain;box-shadow:0 2px 8px #0002;background:white}.status{font-size:13px;white-space:pre-wrap;color:#41516a}.inline{display:flex;align-items:center;gap:8px}.inline input{width:auto}.inline label{margin:0}.warning{background:#fff8e8;padding:12px;border-radius:8px;font-size:12px;line-height:1.6}@media(max-width:850px){main{display:block}.panel{padding:14px}}
</style></head><body><header><h1>漫画ノンブルメーカー</h1><p>PNGをまとめて読み込み、ページ番号を付けてZIP保存</p></header><main><aside><section class="panel"><h2>1. 原稿を読み込む</h2><input id="files" type="file" accept="image/png" multiple><p class="hint">PNGのみ対応。ファイル名の自然順で並べます。画像は外部に送信されません。</p><button id="clear">すべて削除</button></section><section class="panel"><h2>2. ノンブル設定</h2><div class="row"><div class="field"><label for="start">開始番号</label><input id="start" type="number" min="0" value="1"></div><div class="field"><label for="skip">先頭の番号なしページ数</label><input id="skip" type="number" min="0" value="1"></div></div><div class="field"><label for="placement">配置</label><select id="placement"><option value="outer">見開き外側</option><option value="inner">見開き内側</option><option value="left">左下固定</option><option value="right">右下固定</option><option value="center">下中央</option></select></div><div class="field"><label for="binding">綴じ方向</label><select id="binding"><option value="right">右綴じ（日本の漫画）</option><option value="left">左綴じ</option></select></div><div class="field"><label for="format">番号形式</label><select id="format"><option value="plain">1, 2, 3</option><option value="zero">001, 002, 003</option><option value="dash">- 1 -, - 2 -</option></select></div><div class="row"><div class="field"><label for="size">文字サイズ (px)</label><input id="size" type="number" min="1" max="500" value="48"></div><div class="field"><label for="font">フォント</label><select id="font"><option value="sans-serif">ゴシック</option><option value="serif">明朝</option></select></div></div><div class="row"><div class="field"><label for="color">文字色</label><select id="color"><option value="#000000">黒</option><option value="#ffffff">白</option></select></div><div class="field"><label for="opacity">不透明度 (%)</label><input id="opacity" type="number" min="0" max="100" value="100"></div></div><div class="row"><div class="field"><label for="mx">左右余白 (%)</label><input id="mx" type="number" min="0" max="45" value="4"></div><div class="field"><label for="my">下余白 (%)</label><input id="my" type="number" min="0" max="45" value="3"></div></div><p class="hint">開始番号は「最初に番号を付けるページ」の値です。番号なしページは連番に含めません。</p></section><section class="panel"><h2>3. 書き出し</h2><button id="export" class="primary" disabled>PNGをZIPで一括保存</button><p id="status" class="status" role="status"></p><div class="warning">PNGの解像度は維持します。ただしブラウザのCanvas処理では色空間・DPI等のメタデータや元画素の完全一致は保証できません。印刷入稿前には出力結果を確認してください。</div></section></aside><article><section class="panel"><h2>ページ一覧 <span id="count">(0枚)</span></h2><p class="hint">矢印で並べ替えられます。ページごとに番号の表示・非表示を切り替えられます。</p><div id="thumbs" class="thumbs"></div></section><section class="panel"><h2>プレビュー</h2><div class="row"><button id="prev">前のページ</button><button id="next">次のページ</button></div><p id="pageinfo" class="status"></p><div class="preview"><canvas id="canvas"></canvas></div></section></article></main><script>
'use strict';
const $=id=>document.getElementById(id), fields=['start','skip','placement','binding','format','size','font','color','opacity','mx','my'];let pages=[],current=0,renderToken=0;const collator=new Intl.Collator('ja',{numeric:true,sensitivity:'base'});const getSettings=()=>Object.fromEntries(fields.map(k=>[k,$(k).value]));
function numberFor(i,s){if(i<Math.max(0,Number(s.skip)||0)||pages[i]?.hidden)return null;let n=Number(s.start)||0;for(let j=Math.max(0,Number(s.skip)||0);j<i;j++)if(!pages[j].hidden)n++;return n}
function side(n,s){if(s.placement==='left'||s.placement==='right'||s.placement==='center')return s.placement;const odd=n%2!==0;const outerRight=s.binding==='right'?!odd:odd;const right=s.placement==='outer'?outerRight:!outerRight;return right?'right':'left'}
function formatted(n,s){return s.format==='zero'?String(n).padStart(3,'0'):s.format==='dash'?`- ${n} -`:String(n)}
async function draw(page,index,canvas,s){const img=await createImageBitmap(page.file);try{canvas.width=img.width;canvas.height=img.height;const ctx=canvas.getContext('2d',{alpha:true});ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);const n=numberFor(index,s);if(n!==null){const fontSize=Math.max(1,Number(s.size)||48);const mx=canvas.width*(Number(s.mx)||0)/100,my=canvas.height*(Number(s.my)||0)/100;const place=side(n,s);ctx.save();ctx.globalAlpha=Math.max(0,Math.min(100,Number(s.opacity)))/100;ctx.fillStyle=s.color;ctx.font=`${fontSize}px ${s.font}`;ctx.textBaseline='bottom';ctx.textAlign=place==='left'?'left':place==='right'?'right':'center';ctx.fillText(formatted(n,s),place==='left'?mx:place==='right'?canvas.width-mx:canvas.width/2,canvas.height-my);ctx.restore()}}finally{img.close()}}
async function preview(){const token=++renderToken;if(!pages.length){$('canvas').width=1;$('canvas').height=1;$('pageinfo').textContent='画像を読み込んでください';return}current=Math.min(current,pages.length-1);const page=pages[current],s=getSettings(),n=numberFor(current,s);$('pageinfo').textContent=`${current+1} / ${pages.length} : ${page.file.name}　番号 ${n===null?'なし':formatted(n,s)}`;const c=document.createElement('canvas');try{await draw(page,current,c,s);if(token!==renderToken)return;const dst=$('canvas');dst.width=c.width;dst.height=c.height;dst.getContext('2d').drawImage(c,0,0)}catch(e){$('pageinfo').textContent='プレビューエラー: '+e.message}}
function list(){const root=$('thumbs');root.replaceChildren();$('count').textContent=`(${pages.length}枚)`;$('export').disabled=!pages.length;pages.forEach((p,i)=>{const div=document.createElement('div');div.className='thumb';const img=document.createElement('img');img.src=p.url;img.alt=p.file.name;const small=document.createElement('small');small.textContent=p.file.name;const num=document.createElement('small');const n=numberFor(i,getSettings());num.textContent=n===null?'番号なし':'No. '+n;const line=document.createElement('div');line.className='inline';const check=document.createElement('input');check.type='checkbox';check.checked=p.hidden;check.addEventListener('change',()=>{p.hidden=check.checked;list();preview()});const label=document.createElement('label');label.textContent='番号を非表示';line.append(check,label);const buttons=document.createElement('div');buttons.className='buttons';for(const [txt,d] of [['↑',-1],['↓',1]]){const b=document.createElement('button');b.textContent=txt;b.disabled=i+d<0||i+d>=pages.length;b.addEventListener('click',()=>{[pages[i],pages[i+d]]=[pages[i+d],pages[i]];current=i+d;list();preview()});buttons.append(b)}const show=document.createElement('button');show.textContent='表示';show.addEventListener('click',()=>{current=i;preview()});buttons.append(show);div.append(img,small,num,line,buttons);root.append(div)})}
$('files').addEventListener('change',async e=>{const incoming=[...e.target.files].filter(f=>f.type==='image/png'||f.name.toLowerCase().endsWith('.png'));incoming.sort((a,b)=>collator.compare(a.name,b.name));for(const file of incoming)pages.push({file,url:URL.createObjectURL(file),hidden:false});current=0;list();preview();e.target.value=''});
$('clear').addEventListener('click',()=>{pages.forEach(p=>URL.revokeObjectURL(p.url));pages=[];current=0;list();preview();$('status').textContent=''});fields.forEach(k=>$(k).addEventListener('input',()=>{list();preview()}));$('prev').onclick=()=>{if(current>0)current--;preview()};$('next').onclick=()=>{if(current<pages.length-1)current++;preview()};
const crcTable=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;crcTable[n]=c>>>0}function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}function u16(v){return[v&255,(v>>>8)&255]}function u32(v){return[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}
function zipStored(files){const encoder=new TextEncoder(),chunks=[],central=[];let offset=0;for(const {name,data} of files){const filename=encoder.encode(name),crc=crc32(data),len=data.length;const header=new Uint8Array([80,75,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(len),...u32(len),...u16(filename.length),...u16(0)]);chunks.push(header,filename,data);central.push(new Uint8Array([80,75,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(len),...u32(len),...u16(filename.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),filename);offset+=header.length+filename.length+len}const centralLength=central.reduce((s,a)=>s+a.length,0);return new Blob([...chunks,...central,new Uint8Array([80,75,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralLength),...u32(offset),...u16(0)])],{type:'application/zip'})}
$('export').addEventListener('click',async()=>{if(!pages.length)return;const button=$('export');button.disabled=true;const s=getSettings(),outputs=[];try{if(pages.length>65535)throw Error('ZIP形式の制限を超えています');for(let i=0;i<pages.length;i++){$('status').textContent=`処理中: ${i+1}/${pages.length}`;await new Promise(r=>setTimeout(r,0));const canvas=document.createElement('canvas');await draw(pages[i],i,canvas,s);const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG生成に失敗')),'image/png'));const bytes=new Uint8Array(await blob.arrayBuffer());outputs.push({name:`${String(i+1).padStart(Math.max(3,String(pages.length).length),'0')}.png`,data:bytes})}const zip=zipStored(outputs);const url=URL.createObjectURL(zip),a=document.createElement('a');a.href=url;a.download='numbered_pages.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent=`完了: ${pages.length}枚 / ${(zip.size/1048576).toFixed(1)} MB`}catch(e){$('status').textContent='書き出しエラー: '+e.message}finally{button.disabled=!pages.length}});preview();
</script></body></html>
